name = "villefranche-payments"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "villefranche-bookings"
database_id = "8ae3a711-07a0-411c-aba0-75d86ac4bf5e"
migrations_dir = "migrations"

[vars]
# Non-secret configuration (override per environment in Cloudflare dashboard / .dev.vars)
CHECKOUT_CURRENCY = "eur"
BOOKING_PRICE_PER_GUEST_EUR = "149"
ORIGINATING_SITE = "villefrancheshoreexcursions.com"
ORIGINATING_PORT = "Villefranche"
# Trusted public site origin — Checkout success/cancel URLs are built from this only.
SITE_BASE_URL = "https://villefrancheshoreexcursions.com"
SITE_ORIGIN = "https://villefrancheshoreexcursions.com"
# Comma-separated extra CORS origins (localhost always allowed in code).
# Include www if the site is reachable there — Allow-Origin must echo Origin exactly.
CORS_ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://www.villefrancheshoreexcursions.com"
# Internal paid-booking alerts (Resend). From address must be on a verified domain.
INTERNAL_BOOKING_EMAIL = "info@wowatour.com"
EMAIL_FROM = "bookings@notifications.wowatour.com"
EMAIL_FROM_NAME = "Villefranche Shore Excursions"

# Secrets (set via `wrangler secret put` or `.dev.vars` — never commit):
# STRIPE_SECRET_KEY=sk_test_...
# STRIPE_WEBHOOK_SECRET=whsec_...
# RESEND_API_KEY=re_...
